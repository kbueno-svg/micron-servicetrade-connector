services:
  - type: web
    name: micron-servicetrade-connector
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SERVICETRADE_BASE_URL
        value: https://api.servicetrade.com/api
      - key: SERVICETRADE_CLIENT_ID
        sync: false
      - key: SERVICETRADE_CLIENT_SECRET
        sync: false
      - key: CONNECTOR_API_KEY
        generateValue: true
